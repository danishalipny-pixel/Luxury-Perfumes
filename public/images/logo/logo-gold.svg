<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C384" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8C6E2E" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- NOIRÉLLE Emblem: Luxury Flacon Monogram with Diamond Facets -->
  <g transform="translate(16, 12)">
    <!-- Outer Octagonal Luxury Shield / Flacon Outline -->
    <path d="M 17,2 L 31,10 L 31,34 L 17,42 L 3,34 L 3,10 Z" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="1.2" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
    <!-- Inner faceted geometry -->
    <path d="M 17,6 L 27,12 L 27,32 L 17,38 L 7,32 L 7,12 Z" 
          fill="none" 
          stroke="#D8B26E" 
          stroke-width="0.75" 
          stroke-opacity="0.8" />
          
    <!-- Center Flacon Stopper & Droplet -->
    <line x1="17" y1="0" x2="17" y2="6" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="17" cy="0" r="1.5" fill="url(#goldGrad)" />
    <path d="M 17,14 C 19,17 21,20 21,23 C 21,25.2 19.2,27 17,27 C 14.8,27 13,25.2 13,23 C 13,20 15,17 17,14 Z" 
          fill="#D8B26E" />
          
    <!-- Subtle Starlight Cross -->
    <path d="M 17,30 L 17,34 M 15,32 L 19,32" stroke="url(#goldGrad)" stroke-width="0.8" stroke-linecap="round" />
  </g>

  <!-- Wordmark: NOIRÉLLE -->
  <text x="68" y="38" 
        font-family="'Cormorant Garamond', 'Playfair Display', Didot, 'Cinzel', serif" 
        font-size="30" 
        font-weight="600" 
        letter-spacing="0.22em" 
        fill="#C5A059">
    NOIRÉLLE
  </text>
  
  
  <!-- Micro Tagline / Sub-label -->
  <text x="70" y="52" 
        font-family="'Inter', 'Manrope', -apple-system, sans-serif" 
        font-size="7.5" 
        font-weight="400" 
        letter-spacing="0.42em" 
        fill="#D8B26E">
    A WORLD BEYOND FRAGRANCE
  </text>
  
</svg>